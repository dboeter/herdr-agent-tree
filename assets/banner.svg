<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <!-- Colours and glyphs follow agent_tree.py (STATUS, DIM, GROUP, BASE_BG, HERE_TINT).
       banner.png is this file rendered by headless Chromium at 1280x400; re-render it after edits. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2030"/>
      <stop offset="1" stop-color="#15141f"/>
    </linearGradient>
    <style>
      text { font-family: 'JetBrainsMono Nerd Font Mono', 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
      .t { font-size: 21px; fill: #c0caf5; }
      .dim { fill: #6e6e78; }
      .sky { fill: #7dcfff; }
      .sky-dim { fill: #6099be; }
      .blocked { fill: #f7768e; }
      .working { fill: #e0af68; }
      .done { fill: #9ece6a; }
    </style>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- Title block -->
  <text x="80" y="118" font-size="20" fill="#6e6e78" letter-spacing="3">HERDR PLUGIN</text>
  <text x="76" y="200" font-size="84" font-weight="bold" fill="#c0caf5">Agent <tspan fill="#7dcfff">Tree</tspan></text>
  <text x="80" y="250" font-size="24" fill="#a9b1d6">Every workspace and agent in herdr,</text>
  <text x="80" y="282" font-size="24" fill="#a9b1d6">as a live tree beside your work</text>
  <text x="80" y="338" font-size="20" fill="#737aa2" xml:space="preserve"><tspan class="blocked">●</tspan> blocked   <tspan class="working">◐</tspan> working   <tspan class="done">✓</tspan> done   <tspan class="dim">○</tspan> idle   <tspan class="dim">$</tspan> shell</text>

  <!-- Tree pane, as herdr frames it -->
  <rect x="790" y="49" width="430" height="311" rx="4" fill="#1a1b26" stroke="#7dcfff" stroke-width="2"/>

  <!-- The tab you are in: tinted row, ▍ mark at the pane's left edge -->
  <rect x="792" y="95" width="426" height="27" fill="#263140"/>
  <rect x="794" y="95" width="5" height="27" fill="#7dcfff"/>

  <g class="t" xml:space="preserve">
    <text x="812" y="86"><tspan class="dim">1 &#xf0d7; </tspan><tspan class="sky">herdr-agent-tree</tspan></text>
    <text x="812" y="113"><tspan class="dim">  ├ </tspan><tspan class="working">◐</tspan> README Banner</text>
    <text x="812" y="140"><tspan class="dim">  ├ </tspan><tspan class="done">✓</tspan> Narrow Footer</text>
    <text x="812" y="167"><tspan class="dim">  └ $</tspan> Release</text>

    <text x="812" y="194"><tspan class="dim">2 &#xf0d7; </tspan><tspan class="sky-dim">daily-diff</tspan></text>
    <text x="812" y="221"><tspan class="dim">  ├ </tspan><tspan class="blocked">●</tspan> Weekly Trends</text>
    <text x="812" y="248"><tspan class="dim">  └ ○</tspan> Digest</text>

    <text x="812" y="275"><tspan class="dim">3 &#xf0da; </tspan><tspan class="sky-dim">dagent</tspan> <tspan class="working">◐ 2</tspan></text>
  </g>

  <line x1="792" y1="300" x2="1218" y2="300" stroke="#44444d" stroke-width="1.5"/>
  <text x="812" y="336" font-size="21" fill="#6e6e78" xml:space="preserve">6 agents  <tspan class="blocked">● 1</tspan>  <tspan class="working">◐ 3</tspan>  <tspan class="done">✓ 1</tspan></text>
  <text x="1150" y="336" font-size="21" fill="#6e6e78" xml:space="preserve">&#xf067;  &#xf013;</text>
</svg>
