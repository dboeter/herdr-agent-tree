# Agent Tree: workspaces as groups, their agents as a live tree, docked on the
# left (or right) edge of every tab.
#
# Commands go through sh and $HERDR_PLUGIN_ROOT, which herdr sets for every plugin
# process: hook commands run with cwd = plugin root, but a plugin pane's process is
# not guaranteed to, so one rule for all entries keeps the plugin relocatable.

id = "herdr-agent-tree"
name = "Agent Tree"
version = "0.2.1"
min_herdr_version = "0.9.0"
description = "Workspaces and their agents as a live tree, docked on the left or right of every tab."
platforms = ["linux"]

[[panes]]
id = "tree"
title = "Agent Tree"  # agent_tree.py's TITLE matches this to find trees restored without tokens
placement = "split"
command = ["sh", "-c", "exec python3 \"${HERDR_PLUGIN_ROOT:?not launched by herdr}/agent_tree.py\" --ui"]

[[actions]]
id = "toggle"
title = "Toggle agent tree in this tab"
description = "Close the tree in the focused tab and keep it closed there, or bring it back."
command = ["sh", "-c", "exec python3 \"${HERDR_PLUGIN_ROOT:?not launched by herdr}/agent_tree.py\" --toggle"]

[[actions]]
id = "toggle-all"
title = "Toggle agent tree everywhere"
description = "Flip auto_dock in config.toml: off closes every tree, on docks one here."
command = ["sh", "-c", "exec python3 \"${HERDR_PLUGIN_ROOT:?not launched by herdr}/agent_tree.py\" --toggle-all"]

# A restored session brings trees back as plain shells in every tab: close them all
# and dock into the focused tab, rather than one tab at a time as each is focused.
[[startup]]
command = ["sh", "-c", "exec python3 \"${HERDR_PLUGIN_ROOT:?not launched by herdr}/agent_tree.py\" --startup"]

# Dock into the focused tab whenever focus lands somewhere new. tab.created
# waits for the lock so a new tab is never skipped; focus bursts may skip.
[[events]]
on = "tab.created"
command = ["sh", "-c", "exec python3 \"${HERDR_PLUGIN_ROOT:?not launched by herdr}/agent_tree.py\" --ensure --wait"]

[[events]]
on = "tab.focused"
command = ["sh", "-c", "exec python3 \"${HERDR_PLUGIN_ROOT:?not launched by herdr}/agent_tree.py\" --ensure"]

[[events]]
on = "workspace.focused"
command = ["sh", "-c", "exec python3 \"${HERDR_PLUGIN_ROOT:?not launched by herdr}/agent_tree.py\" --ensure"]

[[events]]
on = "workspace.created"
command = ["sh", "-c", "exec python3 \"${HERDR_PLUGIN_ROOT:?not launched by herdr}/agent_tree.py\" --ensure"]
